<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f5f5f5;padding:2rem}
h1{margin-bottom:1rem}.card{background:#fff;border-radius:8px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse}th,td{padding:.5rem;text-align:left;border-bottom:1px solid #eee}
th{background:#f9f9f9;font-weight:600}button{padding:.4rem 1rem;border:none;border-radius:4px;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}button.danger{background:#dc2626}button.danger:hover{background:#b91c1c}
input,select{padding:.4rem;border:1px solid #ddd;border-radius:4px;margin-right:.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:#fff;border-radius:8px;padding:1.5rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat h3{font-size:2rem;color:#2563eb}.stat p{color:#666;margin-top:.5rem}
#toast{position:fixed;top:1rem;right:1rem;background:#22c55e;color:#fff;padding:.8rem 1.5rem;border-radius:8px;display:none}
</style></head><body>
<h1>Admin Dashboard</h1>
<div id="toast"></div>
<div class="stats" id="stats"></div>
<div class="card"><label for="api-token">API bearer token</label>
<input type="password" id="api-token" autocomplete="off" placeholder="Paste a trusted JWT">
<span>Stored only in this page while it remains open.</span></div>
<div class="card"><h2>Messages</h2>
<div style="margin:1rem 0"><input id="message-search" placeholder="Search..." oninput="messageLoad()">
<button onclick="messageLoad()">Refresh</button> <button onclick="messageShowForm()">+ New</button></div>
<div id="message-form" style="display:none;margin:1rem 0;padding:1rem;background:#f9f9f9;border-radius:4px">
<input type="text" id="message-content" placeholder="content *">
<input type="text" id="message-sender" placeholder="sender *">
<label><input type="checkbox" id="message-deleted"> deleted</label> 
<button onclick="messageCreate()">Save</button> <button onclick="document.getElementById('message-form').style.display='none'" class="danger">Cancel</button></div>
<table><thead><tr><th>id</th><th>content</th><th>sender</th><th>created</th><th>deleted</th><th>Actions</th></tr></thead>
<tbody id="message-table"></tbody></table></div>
<script>
const API="";function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2000)}
function apiHeaders(headers={}){const result=new Headers(headers);const token=document.getElementById("api-token").value.trim();if(token)result.set("Authorization","Bearer "+token);return result}
async function apiJson(path,options={}){const headers=apiHeaders(options.headers);if(options.body&&!headers.has("Content-Type"))headers.set("Content-Type","application/json");
const response=await fetch(API+path,{...options,headers});let data;try{data=await response.json()}catch{data=null}
if(!response.ok)throw new Error(data?.error||"Request failed ("+response.status+")");return data}
async function loadStats(){try{const d=await apiJson("/api/health");const s=document.getElementById("stats");s.replaceChildren();
for(const [k,v] of Object.entries(d).filter(([k])=>k!=="status")){const card=document.createElement("div");card.className="stat";const value=document.createElement("h3");value.textContent=String(v);const label=document.createElement("p");label.textContent=k;card.append(value,label);s.append(card)}}catch(e){console.error(e);toast("Could not load dashboard stats")}}
async function messageLoad(){try{const params=new URLSearchParams({search:document.getElementById("message-search").value});
const d=await apiJson("/api/messages?"+params);const items=d.items||d;if(!Array.isArray(items))throw new Error("Unexpected messages response");
const table=document.getElementById("message-table");table.replaceChildren();for(const item of items){const row=document.createElement("tr");
for(const value of [item.id,item.content,item.sender,item.created,item.deleted]){const cell=document.createElement("td");cell.textContent=String(value??"");row.append(cell)}
const actions=document.createElement("td");const button=document.createElement("button");button.textContent="Del";button.addEventListener("click",()=>messageDel(item.id));actions.append(button);row.append(actions);table.append(row)}
}catch(e){console.error(e);toast(e.message)}}
function messageShowForm(){document.getElementById("message-form").style.display="block"}
async function messageCreate(){const body={content:document.getElementById("message-content").value,sender:document.getElementById("message-sender").value,deleted:document.getElementById("message-deleted").checked};
try{await apiJson("/api/messages",{method:"POST",body:JSON.stringify(body)});document.getElementById("message-form").style.display="none";toast("Created!");messageLoad();loadStats()}catch(e){console.error(e);toast(e.message)}}
async function messageDel(id){if(!confirm("Delete?"))return;try{await apiJson("/api/messages/"+encodeURIComponent(id),{method:"DELETE"});toast("Deleted!");messageLoad();loadStats()}catch(e){console.error(e);toast(e.message)}}
loadStats();messageLoad()
</script></body></html>
