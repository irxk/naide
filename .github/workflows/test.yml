name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run test suite
        run: npm test
        env:
          NAIDE_SKIP_RUNTIME_TARGETS: 'true'
      - name: Verify examples compile
        run: |
          node bin/naide.js --emit examples/todo-api.naide > /dev/null
      - name: Verify code generation
        run: |
          node -e "import('./src/gen.js').then(m => { const r = m.generate('REST API for users with auth'); if (!r.valid) { console.error('gen: invalid output'); process.exit(1); } console.log('gen: ok (' + r.intents.join('+') + ')'); })"
          node -e "import('./src/gen.js').then(m => { const r = m.generate('todo app'); if (!r.valid) { console.error('gen: invalid output'); process.exit(1); } console.log('gen: ok (' + r.intents.join('+') + ')'); })"
          node -e "import('./src/gen.js').then(m => { const r = m.generate('users and products and orders with auth'); if (!r.valid || r.entities.length < 3) { console.error('gen: multi-entity failed'); process.exit(1); } console.log('gen: multi-entity ok (' + r.entities.join('+') + ')'); })"
          node -e "import('./src/gen.js').then(m => { const r = m.generate('ECサイト'); if (!r.valid || r.entities.length < 3) { console.error('gen: JP composite failed'); process.exit(1); } console.log('gen: JP composite ok (' + r.entities.join('+') + ')'); })"
      - name: Verify cross-target code generation
        run: |
          set -euo pipefail
          for target in python bun typescript go java rust cpp c csharp kotlin swift dart php ruby; do
            echo "::group::Verify $target code generation"
            node bin/naide.js --emit -t "$target" examples/hello.naide > /dev/null
            echo "  $target: generated successfully"
            echo "::endgroup::"
          done

  runtime-targets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install PHP, Ruby, and Kotlin
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli ruby-full kotlin
      - run: npm ci
      - run: npm run test:targets
      - name: Compile and execute every available target
        run: npm run test:runtimes
        env:
          NAIDE_REQUIRE_RUNTIME_TOOLS: 'true'
