name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: node --test test/edge-cases.js
      - name: Verify examples compile
        run: |
          node bin/naide.js --emit examples/todo-api.naide > /dev/null
          node bin/naide.js --emit examples/todo-api.nx > /dev/null
