<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">NAIDEの現在地</title>
  <desc id="description">人にもAIにも読みやすい単一の言語から、コンパイラーと開発ツールを通じて複数の言語へ出力する、アプリ開発向けの言語・ツールキット。対応状況にはターゲットごとの差がある。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a36"/>
      <stop offset="1" stop-color="#172c52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d8d0"/>
      <stop offset="1" stop-color="#71a9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071126" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
      .muted { fill: #b8c6dc; }
      .white { fill: #f5f8ff; }
      .card { fill: #1d3155; stroke: #39547b; stroke-width: 1.5; }
      .small { font-size: 19px; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1410" cy="90" r="260" fill="#34568c" opacity=".13"/>
  <circle cx="180" cy="930" r="310" fill="#2dc8c1" opacity=".07"/>

  <image href="naide_check.png" x="88" y="61" width="62" height="62"/>
  <text x="170" y="104" class="white" font-size="30" font-weight="700">NAIDE</text>
  <text x="1510" y="99" class="muted" font-size="18" text-anchor="end">いまの立ち位置</text>

  <text x="88" y="205" class="white" font-size="58" font-weight="800">人にもAIにも読みやすい。</text>
  <text x="88" y="275" fill="url(#accent)" font-size="58" font-weight="800">アプリ開発向けの言語とツールキット。</text>
  <text x="91" y="322" class="muted" font-size="22">ひとつの .naide 言語を、コンパイラー・型チェック・開発ツールで支える。</text>

  <g filter="url(#shadow)">
    <rect x="88" y="382" width="330" height="220" rx="24" class="card"/>
    <rect x="473" y="382" width="330" height="220" rx="24" class="card"/>
    <rect x="858" y="382" width="330" height="220" rx="24" class="card"/>
    <rect x="1243" y="382" width="269" height="220" rx="24" class="card"/>
  </g>

  <text x="118" y="425" fill="#6be0d7" class="label">01 · 書く</text>
  <text x="118" y="477" class="white" font-size="31" font-weight="700">人とAIで</text>
  <text x="118" y="517" class="white" font-size="31" font-weight="700">同じNAIDEを書く</text>
  <text x="118" y="560" class="muted small">独自の読みやすい構文</text>
  <text x="118" y="586" class="muted small">AI専用の別方言はなし</text>

  <text x="503" y="425" fill="#6be0d7" class="label">02 · 支える</text>
  <text x="503" y="477" class="white" font-size="31" font-weight="700">コンパイルと</text>
  <text x="503" y="517" class="white" font-size="31" font-weight="700">開発体験</text>
  <text x="503" y="560" class="muted small">型チェック・CLI・MCP</text>
  <text x="503" y="586" class="muted small">アプリ開発の道具を同梱</text>

  <text x="888" y="425" fill="#6be0d7" class="label">03 · 出力する</text>
  <text x="888" y="477" class="white" font-size="31" font-weight="700">ひとつの言語から</text>
  <text x="888" y="517" class="white" font-size="31" font-weight="700">複数ターゲットへ</text>
  <text x="888" y="560" class="muted small">Node.js · Bun · Browser</text>
  <text x="888" y="586" class="muted small">ほかの言語バックエンドも</text>

  <text x="1273" y="425" fill="#6be0d7" class="label">いまの規模</text>
  <text x="1273" y="500" class="white" font-size="62" font-weight="800">15</text>
  <text x="1350" y="497" class="white" font-size="25" font-weight="700">出力先</text>
  <text x="1273" y="548" class="muted small">※成熟度・検証範囲</text>
  <text x="1273" y="576" class="muted small">はターゲットごとに異なる</text>

  <path d="M430 492h28m-10-10 10 10-10 10M815 492h28m-10-10 10 10-10 10M1200 492h28m-10-10 10 10-10 10" fill="none" stroke="#65d9d1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="88" y="648" width="1424" height="123" rx="22" fill="#122341" stroke="#304969" stroke-width="1.5"/>
  <text x="122" y="691" fill="#f3c86b" font-size="19" font-weight="700">誠実な現在地</text>
  <text x="122" y="733" class="white" font-size="23" font-weight="700">「JSの完全な代替」でも「安全を保証する魔法」でもない。</text>
  <text x="805" y="691" class="muted" font-size="19">JS互換は実用的な一部。全ターゲットで機能・品質が同等とは限らない。</text>
  <text x="805" y="733" class="muted" font-size="19">まずは読みやすさ、開発支援、検証できる範囲を着実に強くする。</text>

  <text x="88" y="843" class="white" font-size="26" font-weight="700">ひとことで：</text>
  <text x="250" y="843" fill="url(#accent)" font-size="26" font-weight="700">AI時代の、読みやすいマルチターゲット・アプリ開発言語。</text>
  <text x="88" y="914" class="muted" font-size="17">NAIDE · Node AI Development Environment</text>
  <text x="1512" y="914" class="muted" font-size="17" text-anchor="end">現在のREADME・テスト状況に基づく説明</text>
</svg>
